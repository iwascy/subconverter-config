; --------------------- 核心策略组 ---------------------

; 所有可用节点都由 Sub-Store 规范为 AIRPORT-* 或 SELF-*。
custom_proxy_group=SELECT`select`[]HK Fallback`[]US Fallback`[]HK`[]TW`[]SG`[]JP`[]US`[]UK`[]Self-Hosted-US`[]Self-Hosted-SG`[]Self-Hosted-HK`[]AUTO`[]DIRECT
custom_proxy_group=Self-Hosted-US`select`(?i)^SELF-US-
custom_proxy_group=Self-Hosted-SG`select`(?i)^SELF-SG-
custom_proxy_group=Self-Hosted-HK`select`(?i)^SELF-HK-

custom_proxy_group=AUTO`url-test`(?i)^(AIRPORT|SELF)-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=HK`url-test`(?i)^(AIRPORT|SELF)-HK-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=TW`url-test`(?i)^(AIRPORT|SELF)-TW-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(?i)^(AIRPORT|SELF)-SG-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(?i)^(AIRPORT|SELF)-JP-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US`url-test`(?i)^(AIRPORT|SELF)-US-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=UK`url-test`(?i)^(AIRPORT|SELF)-UK-`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=HK Fallback`fallback`[]HK`[]TW`[]SG`[]JP`[]US`[]UK`http://www.gstatic.com/generate_204`300
custom_proxy_group=US Fallback`fallback`[]US`[]JP`[]SG`[]TW`[]HK`[]UK`http://www.gstatic.com/generate_204`300

